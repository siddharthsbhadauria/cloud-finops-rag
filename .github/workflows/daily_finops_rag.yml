name: Daily FinOps & AI Tokenomics Pipeline

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: finops-rag-pipeline
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Data Pipeline & RAG Evaluator
        run: python generate_dataset.py

      - name: Commit Updated Dataset & Analytical Database
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/
          
          if git commit -m "feat(finops): update daily multi-cloud AI tokenomics matrix [skip ci]"; then
            git push origin main
          else
            echo "No pipeline data changes to commit."
          fi
